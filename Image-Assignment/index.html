<!DOCTYPE html>
<html>
<head>
    <title>Images-Assignment</title>
</head>
<body>

<h1> HTML Images Assignment</h1>

<h2>Question 1</h2>
<img src="flower.jpg" alt="Beautiful flower">

<h2>Question 2</h2>
<img src="images/logo.png" alt="Website logo" width="200">

<h2>Question 3</h2>
<img src="assets/images/banner.jpg" alt="Website banner">

<h2>Question 5</h2>
<img src="images/nature.jpg"
     alt="Beautiful nature view"
     width="300"
     height="200">

<h2>Question 6</h2>
<img src="images/nature.jpg"
     alt="Beautiful nature view"
     title="Click to view full size">

<h2>Question 7</h2>
<img src="images/lazy-image.jpg"
     alt="Lazy loaded image"
     loading="lazy">

<h2>Question 8</h2>
<img src="assets/images/banner.jpg"
     alt="Hero image"
     loading="eager">

<h2>Question 9</h2>
<img src="images/nature.jpg"
     alt="Nature image"
     loading="auto">

<p>The browser decides whether to load the image immediately or later.</p>

<h2>Question 10</h2>
<img src="images/medium.jpg"
     srcset="images/small.jpg 100w,
             images/medium.jpg 200w,
             images/large.jpg 400w"
     alt="Responsive image">

<h2>Question 11</h2>
<img src="images/medium.jpg"
     alt="Beautiful responsive image"
     width="200"
     height="200"
     loading="lazy"
     title="Click to view full size"
     srcset="images/small.jpg 400w,
             images/large.jpg 1200w">

<h2>Question 12</h2>

<img src="assets/logo.png"
     alt="Company logo"
     width="250"
     loading="eager">

<img src="images/products/shoe.jpg"
     alt="Product shoe"
     width="250"
     loading="lazy">

</body>
</html>
